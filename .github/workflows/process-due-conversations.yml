name: Process due conversations

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      contact_ids:
        description: 'Comma-separated GHL contact IDs for a targeted repair (leave empty for normal processing)'
        required: false
        default: ''

permissions: {}

concurrency:
  group: process-due-conversations
  cancel-in-progress: false

jobs:
  process-due:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Release due conversations
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CONTACT_IDS: ${{ inputs.contact_ids }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          base_url="https://dealeradmin-api-eight.vercel.app/api/webhooks/ghl/conversations/process-due"
          target_url="$base_url"
          if [ -n "$CONTACT_IDS" ]; then
            target_url="$target_url?contact_ids=$CONTACT_IDS"
          fi
          max_attempts=3
          retry_delay_seconds=30

          for attempt in $(seq 1 "$max_attempts"); do
            echo "process-due attempt ${attempt}/${max_attempts}"
            if response="$(curl --fail-with-body --silent --show-error --request GET \
              --connect-timeout 10 --max-time 120 \
              --header "Authorization: Bearer $CRON_SECRET" \
              "$target_url")"; then
              curl_status=0
            else
              curl_status=$?
            fi

            if [ "$curl_status" -ne 0 ]; then
              echo "process-due HTTP request failed with status ${curl_status}"
              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "Retrying after ${retry_delay_seconds}s"
                sleep "$retry_delay_seconds"
                continue
              fi
              exit "$curl_status"
            fi

            summary="$(node - "$response" <<'NODE'
          const raw = process.argv[2] ?? '';
          try {
            const result = JSON.parse(raw);
            const guard = result.guard ?? null;
            const transientErrorCodes = new Set([
              'GHL_TIMEOUT',
              'GHL_NETWORK_ERROR',
              'GHL_AUTH_TIMEOUT',
              'GHL_RATE_LIMITED',
              'GHL_CIRCUIT_OPEN',
              'GHL_GUARD_STALE_RUN',
            ]);
            const transientFailures = Array.isArray(guard?.errors)
              && guard.errors.length > 0
              && guard.errors.every((failure) => {
                const code = String(failure?.errorCode ?? '');
                return transientErrorCodes.has(code) || /^GHL_HTTP_5\d\d$/.test(code);
              });
            const retryable = Boolean(
              (guard?.skipped === true
                && ['advisory_lock', 'already_running'].includes(guard.skipReason))
              || transientFailures
              || Boolean(result.guardError),
            );
            const intervalSkip = guard?.skipped === true && guard.skipReason === 'in_memory_interval';
            const ok = Boolean(
              guard
              && guard.enabled === true
              && (guard.skipped !== true || intervalSkip)
              && (guard.failed ?? 0) === 0
              && !result.guardError,
            );
            process.stdout.write(JSON.stringify({
              ok,
              retryable,
              processed: result.processed ?? null,
              guard,
              guardError: result.guardError ?? null,
            }, null, 2));
          } catch (error) {
            process.stdout.write(JSON.stringify({
              ok: false,
              retryable: true,
              processed: null,
              guard: null,
              guardError: `Invalid JSON response: ${error instanceof Error ? error.message : String(error)}`,
            }, null, 2));
          }
          NODE
            )"
            printf '%s\n' "$summary"

            if node -e 'process.exit(JSON.parse(process.argv[1]).ok ? 0 : 1)' "$summary"; then
              exit 0
            fi

            retryable="$(node -p 'JSON.parse(process.argv[1]).retryable ? "true" : "false"' "$summary")"
            if [ "$retryable" = "true" ] && [ "$attempt" -lt "$max_attempts" ]; then
              retry_contact_ids="$(node - "$summary" <<'NODE'
          const result = JSON.parse(process.argv[2]);
          const ids = (result.guard?.errors ?? [])
            .map((failure) => typeof failure?.ghlContactId === 'string' ? failure.ghlContactId.trim() : '')
            .filter(Boolean);
          process.stdout.write(encodeURIComponent([...new Set(ids)].join(',')));
          NODE
              )"
              if [ -n "$retry_contact_ids" ]; then
                target_url="$base_url?contact_ids=$retry_contact_ids"
                echo "Retrying failed contacts after ${retry_delay_seconds}s"
              else
                echo "Guard did not complete; retrying after ${retry_delay_seconds}s"
              fi
              sleep "$retry_delay_seconds"
              continue
            fi
            exit 1
          done
