name: Process due conversations

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      contact_ids:
        description: 'Comma-separated GHL contact IDs for a targeted repair (leave empty for normal processing)'
        required: false
        default: ''

permissions: {}

concurrency:
  group: process-due-conversations
  cancel-in-progress: false

jobs:
  process-due:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Release due conversations
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CONTACT_IDS: ${{ inputs.contact_ids }}
        run: |
          test -n "$CRON_SECRET"
          target_url="https://dealeradmin-api-eight.vercel.app/api/webhooks/ghl/conversations/process-due"
          if [ -n "$CONTACT_IDS" ]; then
            target_url="$target_url?contact_ids=$CONTACT_IDS"
          fi
          response="$(curl --fail-with-body --silent --show-error --request GET \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$target_url")"
          printf '%s\n' "$response"
          node -e '
            const result = JSON.parse(process.argv[1]);
            console.log(JSON.stringify({
              processed: result.processed ?? null,
              guard: result.guard ?? null,
              guardError: result.guardError ?? null,
            }, null, 2));
            if (!result.guard || result.guard.enabled !== true || result.guard.failed > 0 || result.guardError) process.exit(1);
          ' "$response"
