name: Process due conversations

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: process-due-conversations
  cancel-in-progress: false

jobs:
  process-due:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Release due conversations
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          response="$(curl --fail-with-body --silent --show-error --request GET \
            --header "Authorization: Bearer $CRON_SECRET" \
            https://dealeradmin-api-eight.vercel.app/api/webhooks/ghl/conversations/process-due)"
          printf '%s\n' "$response"
          node -e 'const result = JSON.parse(process.argv[1]); if (!result.guard || result.guard.enabled !== true || result.guard.failed > 0 || result.guardError) process.exit(1)' "$response"
