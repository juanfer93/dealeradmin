name: Process due conversations

on:
  # Keep exactly one scheduler with a standard five-minute expression. The
  # offset range expression stopped producing scheduled runs in production;
  # the regular cadence is easier for GitHub Actions to resume and observe.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      contact_ids:
        description: 'Comma-separated GHL contact IDs for a targeted repair (leave empty for normal processing)'
        required: false
        default: ''

permissions: {}

jobs:
  release-due:
    runs-on: ubuntu-latest
    # Four 60-second HTTP attempts plus three 10-second backoffs need more
    # than two minutes. Keep the timeout above the retry budget so a slow
    # Vercel invocation is retried instead of leaving due rows stranded.
    timeout-minutes: 6
    concurrency:
      group: process-due-release
      cancel-in-progress: false
    steps:
      - name: Release due conversations
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CONTACT_IDS: ${{ inputs.contact_ids }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          base_url="https://dealeradmin-api-eight.vercel.app/api/webhooks/ghl/conversations/process-due-only"
          target_url="$base_url"
          if [ -n "$CONTACT_IDS" ]; then
            target_url="$target_url?contact_ids=$CONTACT_IDS"
          fi
          max_attempts=4
          retry_delay_seconds=10

          for attempt in $(seq 1 "$max_attempts"); do
            echo "process-due attempt ${attempt}/${max_attempts}"
            if response="$(curl --fail-with-body --silent --show-error --request GET \
              --connect-timeout 10 --max-time 60 \
              --header "Authorization: Bearer $CRON_SECRET" \
              "$target_url")"; then
              curl_status=0
            else
              curl_status=$?
            fi

            if [ "$curl_status" -ne 0 ]; then
              echo "process-due HTTP request failed with status ${curl_status}"
              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "Retrying after ${retry_delay_seconds}s"
                sleep "$retry_delay_seconds"
                continue
              fi
              exit "$curl_status"
            fi

            summary="$(node - "$response" <<'NODE'
          const raw = process.argv[2] ?? '';
          try {
            const result = JSON.parse(raw);
            const ok = result.accepted === true;
            process.stdout.write(JSON.stringify({
              ok,
              processed: result.processed ?? 0,
              advanced: result.advanced ?? 0,
              skipped: result.skipped ?? 0,
              remainingDue: result.remainingDue ?? 0,
            }, null, 2));
          } catch (error) {
            process.stdout.write(JSON.stringify({
              ok: false,
              processed: null,
              advanced: null,
              skipped: null,
              remainingDue: null,
              error: `Invalid JSON response: ${error instanceof Error ? error.message : String(error)}`,
            }, null, 2));
          }
          NODE
            )"
            printf '%s\n' "$summary"

            if node -e 'process.exit(JSON.parse(process.argv[1]).ok ? 0 : 1)' "$summary"; then
              skipped="$(node -p 'JSON.parse(process.argv[1]).skipped ?? 0' "$summary")"
              remaining_due="$(node -p 'JSON.parse(process.argv[1]).remainingDue ?? 0' "$summary")"
              if [ "$skipped" -gt 0 ] || [ "$remaining_due" -gt 0 ]; then
                if [ "$attempt" -lt "$max_attempts" ]; then
                  echo "Due release still has ${remaining_due} due row(s) and ${skipped} skipped cycle(s); retrying after ${retry_delay_seconds}s"
                  sleep "$retry_delay_seconds"
                  continue
                fi
                echo "::error::Due release still has ${remaining_due} due row(s) and ${skipped} skipped cycle(s) after ${max_attempts} attempts"
                exit 1
              fi
              exit 0
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Due release did not return accepted=true; retrying after ${retry_delay_seconds}s"
              sleep "$retry_delay_seconds"
              continue
            fi
            exit 1
          done

  queued-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    # Targeted repairs run the contact-scoped Guard below. Wait for that job
    # before starting the global queued replay so both requests cannot race
    # for the same advisory lock. For scheduled runs, run-guard is skipped
    # and this job still proceeds because the condition below uses always().
    needs: [release-due, run-guard]
    # The backup replay is independent of due-release success. If the release
    # job fails, already-queued contacts must still get their one Guard replay.
    if: ${{ always() && needs.release-due.result != 'cancelled' && needs.run-guard.result != 'cancelled' }}
    concurrency:
      group: process-due-queued-backup
      cancel-in-progress: false
    steps:
      - name: Drain queued backup replays (required)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          backup_url="https://dealeradmin-api-eight.vercel.app/api/webhooks/ghl/conversations/run-guard?queued_backup=true"
          # A webhook-triggered Guard may legitimately hold the global lease
          # while it finishes a slow GHL read. Drain several bounded batches
          # per workflow run, while leaving the remainder for the next cron.
          max_batches=5
          retry_delay_seconds=20
          progress=0

          for batch in $(seq 1 "$max_batches"); do
            echo "queued-backup batch ${batch}/${max_batches}"
            if response="$(curl --fail-with-body --silent --show-error --request GET \
              --connect-timeout 10 --max-time 180 \
              --header "Authorization: Bearer $CRON_SECRET" \
              "$backup_url")"; then
              curl_status=0
            else
              curl_status=$?
            fi
            printf '%s\n' "$response"
            if [ "$curl_status" -eq 0 ]; then
              summary="$(node - "$response" <<'NODE'
          const result = JSON.parse(process.argv[2] ?? '{}');
          process.stdout.write(JSON.stringify({
            accepted: result.accepted === true,
            selected: result.guard?.queuedReplaySelected ?? 0,
            completed: result.guard?.queuedReplayCompleted ?? 0,
            failed: result.guard?.queuedReplayFailed ?? 0,
            pending: result.guard?.pendingQueuedReplayCount ?? 0,
          }));
          NODE
              )"
              printf '%s\n' "$summary"
              selected="$(node -p 'JSON.parse(process.argv[1]).selected ?? 0' "$summary")"
              completed="$(node -p 'JSON.parse(process.argv[1]).completed ?? 0' "$summary")"
              pending="$(node -p 'JSON.parse(process.argv[1]).pending ?? 0' "$summary")"
              if [ "$completed" -gt 0 ]; then
                progress=1
              fi
              if [ "$pending" -eq 0 ]; then
                exit 0
              fi
              # A failed row is released with retry backoff, so the next
              # request can select another row instead of retrying the same
              # blocker. A busy lease gets the normal short retry delay.
              if [ "$batch" -lt "$max_batches" ]; then
                if [ "$selected" -gt 0 ] || [ "$completed" -gt 0 ]; then
                  sleep 2
                else
                  sleep "$retry_delay_seconds"
                fi
                continue
              fi
            fi
            if [ "$batch" -lt "$max_batches" ]; then
              sleep "$retry_delay_seconds"
              continue
            fi
            if [ "$progress" -eq 1 ]; then
              echo "::warning::Queued backup drained bounded progress; remaining rows continue on the next schedule"
              exit 0
            fi
            echo "::error::Queued backup made no progress after ${max_batches} batches"
            exit 1
          done

  run-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    needs: release-due
    # Targeted repairs run the contact-scoped Guard below. The normal due
    # endpoint performs the recent 24-hour Guard pass as part of each cycle.
    # Keep this job for an explicitly targeted repair.
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.contact_ids != '' }}
    concurrency:
      group: process-due-guard
      cancel-in-progress: false
    steps:
      - name: Run GHL guard (required for targeted repair)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CONTACT_IDS: ${{ inputs.contact_ids }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          guard_url="https://dealeradmin-api-eight.vercel.app/api/webhooks/ghl/conversations/run-guard"
          if [ -n "$CONTACT_IDS" ]; then
            guard_url="$guard_url?contact_ids=$CONTACT_IDS"
          fi
          # The production lease is three minutes. Keep retrying beyond that
          # lease lifetime so an invocation that is still draining GHL cannot
          # make this targeted repair look successful without doing any work.
          max_attempts=10
          retry_delay_seconds=30

          for attempt in $(seq 1 "$max_attempts"); do
            echo "run-guard attempt ${attempt}/${max_attempts}"
            if response="$(curl --fail-with-body --silent --show-error --request GET \
              --connect-timeout 10 --max-time 180 \
              --header "Authorization: Bearer $CRON_SECRET" \
              "$guard_url")"; then
              curl_status=0
            else
              curl_status=$?
            fi

            if [ "$curl_status" -ne 0 ]; then
              echo "GHL guard HTTP request failed with status ${curl_status}"
              if [ "$attempt" -lt "$max_attempts" ]; then
                sleep "$retry_delay_seconds"
                continue
              fi
              exit "$curl_status"
            fi

            summary="$(node - "$response" <<'NODE'
          const raw = process.argv[2] ?? '';
          try {
            const result = JSON.parse(raw);
            const guard = result.guard ?? null;
            const retryable = Boolean(
              guard?.skipped === true
              && ['already_running', 'advisory_lock'].includes(guard.skipReason),
            );
            process.stdout.write(JSON.stringify({
              retryable,
              accepted: result.accepted === true,
              skipped: guard?.skipped === true,
              skipReason: guard?.skipReason ?? null,
            }, null, 2));
          } catch (error) {
            process.stdout.write(JSON.stringify({
              retryable: true,
              accepted: false,
              skipped: false,
              skipReason: null,
              error: `Invalid JSON response: ${error instanceof Error ? error.message : String(error)}`,
            }, null, 2));
          }
          NODE
            )"
            printf '%s\n' "$summary"

            retryable="$(node -p 'JSON.parse(process.argv[1]).retryable ? "true" : "false"' "$summary")"
            if [ "$retryable" = "true" ] && [ "$attempt" -lt "$max_attempts" ]; then
              echo "GHL guard is busy; retrying after ${retry_delay_seconds}s"
              sleep "$retry_delay_seconds"
              continue
            fi
            if [ "$retryable" = "true" ]; then
              echo "::error::GHL guard remained busy after ${max_attempts} attempts"
              exit 1
            fi
            accepted="$(node -p 'JSON.parse(process.argv[1]).accepted ? "true" : "false"' "$summary")"
            if [ "$accepted" != "true" ]; then
              echo "::error::GHL guard did not accept the scheduled cycle"
              exit 1
            fi
            exit 0
          done
