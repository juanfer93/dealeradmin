name: Process due conversations watchdog

on:
  # Keep two offset schedulers as a database-aware safety net. The endpoint owns
  # the row health check and the database lock, so duplicate invocations are
  # safe and a missed primary tick cannot strand a due cycle.
  # Keep this trigger on the default branch so the safety-net cadence remains
  # registered after workflow changes.
  schedule:
    - cron: '2-59/5 * * * *'
    # GitHub may delay or drop a scheduled event during platform load. Keep a
    # second offset safety tick so a newly overdue row is not stranded until
    # the next aligned tick; the database lock makes the overlapping call safe.
    - cron: '4-59/5 * * * *'
  workflow_dispatch:

permissions:
  actions: read

jobs:
  release-due-watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      guard_contact_ids: ${{ steps.compose_guard_ids.outputs.guard_contact_ids }}
      fallback_needed: ${{ steps.due-health.outputs.fallback_needed }}
    concurrency:
      # Keep the safety net independent from the primary scheduler. The API
      # release is row-safe through FOR UPDATE SKIP LOCKED, so an overlapping
      # attempt is harmless. Cancel a stalled watchdog so the next safety tick
      # can reclaim the work instead of waiting behind the blocked run.
      group: process-due-watchdog-release
      cancel-in-progress: true
    steps:
      - name: Check database due-cycle health
        id: due-health
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual watchdog dispatch requested; checking database due-cycle health."
          fi

          test -n "$CRON_SECRET"
          health_url="https://dealeradmin-api-eight.vercel.app/api/webhooks/ghl/conversations/due-health?recent_only=true"
          if ! health_response="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$health_url")"; then
            echo "::warning::Could not read database due-cycle health; running the safety fallback"
            echo "fallback_needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "$health_response"
          guard_retry_contact_ids="$(node - "$health_response" <<'NODE'
          const payload = JSON.parse(process.argv[2] ?? '{}');
          const ids = Array.isArray(payload.guardRetryContactIds)
            ? [...new Set(payload.guardRetryContactIds.filter((value) => typeof value === 'string' && value.trim()).map((value) => value.trim()))]
            : [];
          process.stdout.write(ids.join(','));
          NODE
          )"
          echo "guard_retry_contact_ids=$guard_retry_contact_ids" >> "$GITHUB_OUTPUT"
          decision="$(node - "$health_response" <<'NODE'
          const payload = JSON.parse(process.argv[2] ?? '{}');
          const needsRelease = Number(payload.overdueCount ?? 0) > 0
            || Number(payload.missingNextAttemptCount ?? 0) > 0
            || (Array.isArray(payload.guardRetryContactIds) && payload.guardRetryContactIds.length > 0);
          process.stdout.write(needsRelease ? 'fallback' : 'healthy');
          NODE
          )"

          if [ "$decision" = "healthy" ]; then
            echo "Database has no overdue or unscheduled waiting-window rows."
            echo "fallback_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Database reports a due or unscheduled waiting-window row; running the safety fallback."
            echo "fallback_needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release due conversations from watchdog
        id: release_watchdog
        if: steps.due-health.outputs.fallback_needed == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          endpoint="https://dealeradmin-api-eight.vercel.app/api/webhooks/ghl/conversations/watchdog"
          max_attempts=4
          retry_delay_seconds=10

          for attempt in $(seq 1 "$max_attempts"); do
            echo "watchdog release attempt ${attempt}/${max_attempts}"
            if response="$(curl --fail-with-body --silent --show-error --request GET \
              --connect-timeout 10 --max-time 60 \
              --header "Authorization: Bearer $CRON_SECRET" \
              "$endpoint")"; then
              curl_status=0
            else
              curl_status=$?
            fi

            if [ "$curl_status" -eq 0 ]; then
              printf '%s\n' "$response"
              summary="$(node - "$response" <<'NODE'
          const result = JSON.parse(process.argv[2] ?? '{}');
          process.stdout.write(JSON.stringify({
            accepted: result.accepted === true,
            skipped: result.skipped ?? 0,
            remainingDue: result.remainingDue ?? 0,
            guardContactIds: [...new Set([
              ...(Array.isArray(result.release?.guardContactIds) ? result.release.guardContactIds : []),
              ...(Array.isArray(result.guardContactIds) ? result.guardContactIds : []),
            ])],
          }));
          NODE
              )"
              printf '%s\n' "$summary"
              guard_contact_ids="$(node -p 'JSON.parse(process.argv[1]).guardContactIds.join(",")' "$summary")"
              echo "guard_contact_ids=$guard_contact_ids" >> "$GITHUB_OUTPUT"
              accepted="$(node -p 'JSON.parse(process.argv[1]).accepted ? "true" : "false"' "$summary")"
              skipped="$(node -p 'JSON.parse(process.argv[1]).skipped ?? 0' "$summary")"
              remaining_due="$(node -p 'JSON.parse(process.argv[1]).remainingDue ?? 0' "$summary")"
              if [ "$accepted" = "true" ] && [ "$skipped" -eq 0 ] && [ "$remaining_due" -eq 0 ]; then
                exit 0
              fi
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Watchdog release was incomplete; retrying after ${retry_delay_seconds}s"
              sleep "$retry_delay_seconds"
              continue
            fi
            echo "::error::Watchdog release did not clear due rows after ${max_attempts} attempts"
            exit 1
          done

      - name: Compose durable Guard contact list
        id: compose_guard_ids
        if: always()
        env:
          HEALTH_GUARD_CONTACT_IDS: ${{ steps.due-health.outputs.guard_retry_contact_ids }}
          RELEASE_GUARD_CONTACT_IDS: ${{ steps.release_watchdog.outputs.guard_contact_ids }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const values = [
            process.env.HEALTH_GUARD_CONTACT_IDS ?? '',
            process.env.RELEASE_GUARD_CONTACT_IDS ?? '',
          ];
          const ids = [...new Set(values.flatMap((value) => value.split(',')).map((value) => value.trim()).filter(Boolean))];
          require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, `guard_contact_ids=${ids.join(',')}\n`);
          console.log(`Composed ${ids.length} durable Guard contact id(s).`);
          NODE

  due-guard-watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    needs: release-due-watchdog
    # The watchdog release is authoritative for the state transition; this
    # Guard pass is best effort and cannot hold an overdue waiting row.
    if: ${{ always() && needs.release-due-watchdog.result != 'cancelled' && needs.release-due-watchdog.outputs.guard_contact_ids != '' }}
    concurrency:
      group: process-due-guard
      cancel-in-progress: false
    steps:
      - name: Run Guard for watchdog-released contacts
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CONTACT_IDS: ${{ needs.release-due-watchdog.outputs.guard_contact_ids }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          guard_url="https://dealeradmin-api-eight.vercel.app/api/webhooks/ghl/conversations/run-guard?contact_ids=$CONTACT_IDS&reconcile=true"
          max_attempts=4
          retry_delay_seconds=30

          for attempt in $(seq 1 "$max_attempts"); do
            echo "watchdog Guard attempt ${attempt}/${max_attempts}"
            if response="$(curl --fail-with-body --silent --show-error --request GET \
              --connect-timeout 10 --max-time 180 \
              --header "Authorization: Bearer $CRON_SECRET" \
              "$guard_url")"; then
              curl_status=0
            else
              curl_status=$?
            fi
            printf '%s\n' "$response"
            if [ "$curl_status" -eq 0 ]; then
              retryable="$(node -p '(() => { const r = JSON.parse(process.argv[1]); const g = r.guard ?? {}; return g.skipped && ["already_running", "advisory_lock"].includes(g.skipReason) ? "true" : "false"; })()' "$response")"
              if [ "$retryable" != "true" ]; then
                exit 0
              fi
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep "$retry_delay_seconds"
              continue
            fi
            echo "::warning::Watchdog Guard did not complete; the persisted contact retry remains available for the next cycle"
            exit 0
          done

  queued-backup-watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    needs: [release-due-watchdog, due-guard-watchdog]
    # Queued replays are independent from waiting-window health. A contact
    # can already be queued with an unconsumed Guard replay even when there is
    # no overdue waiting_window row, so the backup must run on every watchdog
    # tick and not only when the due-row fallback is needed.
    if: ${{ always() && needs.release-due-watchdog.result != 'cancelled' && needs.due-guard-watchdog.result != 'cancelled' }}
    concurrency:
      # Keep the final queued replay serialized with the primary backup job.
      group: process-due-queued-backup
      cancel-in-progress: false
    steps:
      - name: Drain queued backup replays from watchdog
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          endpoint="https://dealeradmin-api-eight.vercel.app/api/webhooks/ghl/conversations/run-guard?queued_backup=true"
          max_batches=5
          retry_delay_seconds=20
          progress=0

          for batch in $(seq 1 "$max_batches"); do
            echo "watchdog queued-backup batch ${batch}/${max_batches}"
            if response="$(curl --fail-with-body --silent --show-error --request GET \
              --connect-timeout 10 --max-time 180 \
              --header "Authorization: Bearer $CRON_SECRET" \
              "$endpoint")"; then
              curl_status=0
            else
              curl_status=$?
            fi

            if [ "$curl_status" -eq 0 ]; then
              printf '%s\n' "$response"
              summary="$(node - "$response" <<'NODE'
          const result = JSON.parse(process.argv[2] ?? '{}');
          const guard = result.guard ?? {};
          process.stdout.write(JSON.stringify({
            selected: guard.queuedReplaySelected ?? 0,
            completed: guard.queuedReplayCompleted ?? 0,
            failed: guard.queuedReplayFailed ?? 0,
            pending: guard.pendingQueuedReplayCount ?? 0,
          }));
          NODE
              )"
              printf '%s\n' "$summary"
              selected="$(node -p 'JSON.parse(process.argv[1]).selected ?? 0' "$summary")"
              completed="$(node -p 'JSON.parse(process.argv[1]).completed ?? 0' "$summary")"
              pending="$(node -p 'JSON.parse(process.argv[1]).pending ?? 0' "$summary")"
              if [ "$completed" -gt 0 ]; then progress=1; fi
              if [ "$pending" -eq 0 ]; then exit 0; fi
              if [ "$batch" -lt "$max_batches" ]; then
                if [ "$selected" -gt 0 ] || [ "$completed" -gt 0 ]; then
                  sleep 2
                else
                  sleep "$retry_delay_seconds"
                fi
                continue
              fi
            fi
            if [ "$batch" -lt "$max_batches" ]; then
              sleep "$retry_delay_seconds"
              continue
            fi
            if [ "$progress" -eq 1 ]; then
              echo "::warning::Watchdog backup made bounded progress; remaining rows continue on the next tick"
              exit 0
            fi
            # No row becoming claimable during this bounded window is
            # recoverable: the next watchdog tick will retry the remaining
            # queue. Keep the warning for observability without making the
            # whole watchdog workflow red.
            echo "::warning::Watchdog backup made no progress after ${max_batches} batches; remaining rows continue on the next tick"
            exit 0
          done
