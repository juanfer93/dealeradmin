name: Process media attachments

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  process-media:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DEALERADMIN_API_URL: https://dealeradmin-api-eight.vercel.app/api
      GHL_WEBHOOK_SECRET: ${{ secrets.GHL_WEBHOOK_SECRET }}
      GHL_MEDIA_BEARER_TOKEN: ${{ secrets.GHL_MEDIA_BEARER_TOKEN }}
      MEDIA_LOCAL_VISION_MODEL: HuggingFaceTB/SmolVLM-500M-Instruct
      MEDIA_LOCAL_VISION_REQUIRED: 'true'
      MEDIA_RUN_ONCE: 'true'
      MEDIA_POLL_SECONDS: '1'
    steps:
      - name: Check out worker
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: media-worker/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-spa

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: media-models-${{ runner.os }}-smolvlm500-whisper-small-v1

      - name: Install media worker dependencies
        run: python -m pip install --upgrade pip && python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r media-worker/requirements.txt

      - name: Preload local vision model
        run: python -c "from transformers import AutoProcessor, AutoModelForImageTextToText; n='HuggingFaceTB/SmolVLM-500M-Instruct'; AutoProcessor.from_pretrained(n); AutoModelForImageTextToText.from_pretrained(n)"

      - name: Process pending attachments
        run: python media-worker/worker.py
