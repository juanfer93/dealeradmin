name: Process media attachments

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      conversation_id:
        description: 'Optional conversation UUID to process without touching the global media queue'
        required: false
        type: string
      media_kind:
        description: 'Optional media mode for a targeted recovery'
        required: false
        default: all
        type: choice
        options:
          - all
          - audio

concurrency:
  group: process-media-attachments
  cancel-in-progress: false

jobs:
  process-media:
    runs-on: ubuntu-latest
    # The hosted runner can spend several minutes resolving the Ubuntu media
    # packages on a cold image. Keep the worker alive long enough to reach the
    # actual queue instead of cancelling it during setup.
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DEALERADMIN_API_URL: https://dealeradmin.onrender.com/api
      GHL_WEBHOOK_SECRET: ${{ secrets.GHL_WEBHOOK_SECRET }}
      GHL_MEDIA_BEARER_TOKEN: ${{ secrets.GHL_MEDIA_BEARER_TOKEN }}
      MEDIA_LOCAL_VISION_MODEL: HuggingFaceTB/SmolVLM-500M-Instruct
      MEDIA_LOCAL_VISION_REQUIRED: 'true'
      MEDIA_RUN_ONCE: 'true'
      MEDIA_POLL_SECONDS: '1'
      MEDIA_CONVERSATION_ID: ${{ inputs.conversation_id }}
      MEDIA_AUDIO_ONLY: ${{ inputs.media_kind == 'audio' && 'true' || 'false' }}
    steps:
      - name: Check out worker
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: media-worker/requirements.txt

      - name: Ensure media binaries
        shell: bash
        run: |
          missing=()
          command -v ffmpeg >/dev/null 2>&1 || missing+=(ffmpeg)
          if [ "$MEDIA_AUDIO_ONLY" != "true" ]; then
            if ! command -v tesseract >/dev/null 2>&1; then
              missing+=(tesseract-ocr tesseract-ocr-spa)
            elif ! tesseract --list-langs 2>/dev/null | grep -qx 'spa'; then
              missing+=(tesseract-ocr-spa)
            fi
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi
          ffmpeg -version | head -n 1
          if [ "$MEDIA_AUDIO_ONLY" != "true" ]; then tesseract --version | head -n 1; fi

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: media-models-${{ runner.os }}-smolvlm500-whisper-small-v1

      - name: Install media worker dependencies
        run: python -m pip install --upgrade pip && python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r media-worker/requirements.txt

      - name: Verify database target
        run: |
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ["DATABASE_URL"]) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("SELECT current_database(), current_schema()")
                  database, schema = cursor.fetchone()
                  print(f"database={database} schema={schema}")
                  conversation_id = os.environ.get("MEDIA_CONVERSATION_ID", "").strip()
                  if conversation_id:
                      cursor.execute(
                          "SELECT count(*) FROM conversation_attachments WHERE conversation_id = %s",
                          (conversation_id,),
                      )
                      print(f"target_attachment_count={cursor.fetchone()[0]}")
          PY

      - name: Run media worker tests
        run: python -m unittest discover -s media-worker -p 'test_*.py'

      - name: Process pending attachments
        run: python media-worker/worker.py
