name: Replay failed webhook ingress

on:
  workflow_dispatch:
    inputs:
      since:
        description: 'Only replay failed customer-replied ingress received at or after this UTC timestamp'
        required: true
        default: '2026-10-27T18:00:00.000Z'
      limit:
        description: 'Maximum failed ingress rows to replay'
        required: true
        default: '250'

permissions: {}

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Replay failed customer-replied ingress
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SINCE: ${{ inputs.since }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          response="$(curl --fail-with-body --silent --show-error --get \
            --connect-timeout 10 --max-time 600 \
            --header "Authorization: Bearer $CRON_SECRET" \
            --data-urlencode "since=$SINCE" \
            --data-urlencode "limit=$LIMIT" \
            "https://dealeradmin-api-eight.vercel.app/api/webhooks/ghl/replay-failed")"
          printf '%s\n' "$response"
          node - "$response" <<'NODE'
          const result = JSON.parse(process.argv[2] ?? '{}');
          if (result.accepted !== true || (result.failed ?? 0) > 0) {
            console.error('Replay did not complete cleanly');
            process.exit(1);
          }
          console.log(JSON.stringify({
            selected: result.selected ?? 0,
            processed: result.processed ?? 0,
            duplicateIgnored: result.duplicateIgnored ?? 0,
            ignoredChannel: result.ignoredChannel ?? 0,
            failed: result.failed ?? 0,
          }));
          NODE
