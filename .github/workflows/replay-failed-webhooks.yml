name: Replay failed or unprocessed webhook ingress

on:
  workflow_dispatch:
    inputs:
      since:
        description: 'Replay failed or accepted-but-unprocessed customer-replied ingress received at or after this UTC timestamp'
        required: true
        default: '2026-10-27T18:00:00.000Z'
      limit:
        description: 'Maximum ingress rows to replay'
        required: true
        default: '250'

permissions: {}

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Replay failed or unprocessed customer-replied ingress
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SINCE: ${{ inputs.since }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          response="$(curl --fail-with-body --silent --show-error --get \
            --connect-timeout 10 --max-time 600 \
            --header "Authorization: Bearer $CRON_SECRET" \
            --data-urlencode "since=$SINCE" \
            --data-urlencode "limit=$LIMIT" \
            "https://dealeradmin.163-192-138-175.sslip.io/api/webhooks/ghl/replay-failed")"
          printf '%s\n' "$response"
